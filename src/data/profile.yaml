  description: Gian Luca Pasin is an economic sociologist and postdoctoral researcher at LABSS-CNR, studying how social norms emerge, persist and change using experiments and surveys.
  bio: |
    I am an economic sociologist and a postdoctoral researcher at the Laboratory of Agent-Based Social Simulation (LABSS), Institute of Cognitive Sciences and Technologies of the Italian National Research Council (ISTC-CNR), where I work on the Norms@Risk project.
    My research investigates how social norms emerge, persist and change, and how institutions, enforcement and metanorms sustain cooperation. I apply these questions to tax compliance, cultural change and climate action and social tipping dynamics.
    Methodologically, I rely on quantitative approaches: online and lab experiments, large-scale cross-national surveys.
    I hold a PhD in Economic Sociology and Labour Studies from the University of Milan (NASP), a Master in Economics from Collegio Carlo Alberto and an MSc in Statistics, Economics and Business from the University of Bologna.
